<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legado de Honor · Solicitud de información</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1f2a1c;--panel:#f3f1ea;--ink:#1b1f17;--muted:#5d6455;
  --line:#d6d2c4;--wa:#1faa54;--wa-dark:#178a44;--accent:#c9a54a;
}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.55 Inter,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
  padding:24px 16px;
  background-image:radial-gradient(circle at 20% 10%,#2d3b28 0,transparent 55%),radial-gradient(circle at 90% 90%,#141b12 0,transparent 50%)}
.card{width:100%;max-width:460px;background:var(--panel);border-radius:18px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.45)}
.top{background:#2a3825;color:#f3f1ea;padding:26px 26px 22px;text-align:center}
.top svg{width:56px;height:56px;display:block;margin:0 auto 10px}
.top h1{font:600 26px/1.1 Oswald,sans-serif;margin:0;letter-spacing:.5px}
.top p{margin:6px 0 0;font-size:14px;color:#cfd4c6}
.badge{display:inline-flex;align-items:center;gap:8px;margin-top:16px;background:var(--accent);
  color:#1b1f17;font:600 22px/1 Oswald,sans-serif;padding:10px 18px;border-radius:999px}
.badge small{font:500 12px Inter,sans-serif;opacity:.8}
.body{padding:24px 26px 26px}
.welcome{font-size:17px;margin:0 0 18px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:16px Inter,sans-serif;padding:13px 14px;border:1.5px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink)}
input:focus{outline:3px solid rgba(31,170,84,.35);border-color:var(--wa)}
.preview{margin:18px 0;background:#e3f6e8;border-radius:12px 12px 12px 2px;padding:14px 16px;
  font-size:15px;border:1px solid #c4e8cf}
.preview b{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;
  background:var(--wa);color:#fff;text-decoration:none;font:600 17px Inter,sans-serif;border-radius:12px;border:0;cursor:pointer}
.btn:hover{background:var(--wa-dark)}
.btn:focus-visible{outline:3px solid #0b5d2a;outline-offset:2px}
.btn svg{width:24px;height:24px;fill:#fff}
.err{color:#a32020;font-size:13px;margin-top:6px;display:none}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4 8 13v17c0 15 10 26 24 30 14-4 24-15 24-30V13L32 4z" fill="#c9a54a"/><path d="M32 10 14 17v13c0 11 7 20 18 24 11-4 18-13 18-24V17L32 10z" fill="#2a3825"/><path d="m32 20 3.6 7.3 8 1.2-5.8 5.6 1.4 8L32 38.3l-7.2 3.8 1.4-8-5.8-5.6 8-1.2z" fill="#c9a54a"/></svg>
    <h1>LEGADO DE HONOR</h1>
    <p>Disciplina. Defensa. Lealtad.</p>
    <div class="badge"><small>Tu código</small><span id="code">ALFA …</span></div>
  </div>
  <div class="body">
    <p class="welcome">¡Bienvenido! Escribe tu nombre y te conectamos con un asesor por WhatsApp.</p>
    <label for="name">Tu nombre</label>
    <input id="name" type="text" placeholder="Ej: Juan Pérez" autocomplete="name">
    <div class="err" id="err">Por favor escribe tu nombre.</div>
    <div class="preview"><b>Mensaje que se enviará</b><span id="msg"></span></div>
    <a class="btn" id="wa" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.5-.7-2.3-1.5-.6-.6-1-1.3-1.2-1.6-.1-.2 0-.4.1-.5l.4-.4.3-.4v-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>
      Escribir por WhatsApp
    </a>
    <p class="foot">Atención personalizada · Academia de Justicia Militar</p>
  </div>
</main>

<script>
{
  // ====== CONFIGURACIÓN ======
  const WHATSAPP = "573125912369";          // 57 + número
  const NS = "legado-de-honor-mja";          // nombre del contador (no cambiar)
  const KEY = "alfa-visitantes";
  // ===========================

  const codeEl = document.getElementById("code");
  const nameEl = document.getElementById("name");
  const msgEl  = document.getElementById("msg");
  const waEl   = document.getElementById("wa");
  const errEl  = document.getElementById("err");
  let alfa = null;

  const store = {
    get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
    set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  };

  async function sumarContador(){
    // Contador compartido en internet: cada persona nueva suma 1.
    const fuentes = [
      async () => { const r = await fetch(`https://api.counterapi.dev/v1/${NS}/${KEY}/up`); const j = await r.json(); return j.count; },
      async () => { const r = await fetch(`https://abacus.jasoncameron.dev/hit/${NS}/${KEY}`); const j = await r.json(); return j.value; },
      async () => { const r = await fetch(`/api/alfa`, {method:"POST"}); const j = await r.json(); return j.count; }
    ];
    for (const f of fuentes){
      try { const n = Number(await f()); if (n > 0) return n; } catch(e) {}
    }
    return null;
  }

  function mensaje(){
    const nombre = nameEl.value.trim();
    const codigo = alfa ? `ALFA ${alfa}` : "ALFA";
    return `Buen día, requiero mayor información. Soy ${nombre || "______"} – ${codigo}`;
  }

  function actualizar(){
    msgEl.textContent = mensaje();
    waEl.href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje())}`;
  }

  async function iniciar(){
    // Si esta persona ya entró antes desde este celular, conserva su mismo número.
    const guardado = store.get("alfa-numero");
    if (guardado) { alfa = Number(guardado); }
    else {
      alfa = await sumarContador();
      if (alfa) store.set("alfa-numero", String(alfa));
    }
    codeEl.textContent = alfa ? `ALFA ${alfa}` : "ALFA";
    actualizar();
  }

  nameEl.addEventListener("input", () => { errEl.style.display = "none"; actualizar(); });
  waEl.addEventListener("click", (e) => {
    if (!nameEl.value.trim()) { e.preventDefault(); errEl.style.display = "block"; nameEl.focus(); }
  });

  actualizar();
  iniciar();
}
</script>
</body>
</html>
